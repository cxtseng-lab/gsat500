button.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
.spacer{flex:1}
.note{font-size:.8rem;color:var(--muted);margin:12px 0 0}

.w{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.w.known{background:var(--ok-soft);border-color:var(--ok)}

.zh{font-weight:500}
.col{font-family:var(--f-word);font-style:italic;font-size:.88rem;color:var(--muted)}
.yr{font-family:var(--f-mono);font-size:.72rem;color:var(--accent);font-variant-numeric:tabular-nums}
.hidezh .w:not(.peek) .zh{filter:blur(6px);user-select:none}

The old wooden [structure] was damaged in the fire.|那棟老木造建築在火災中受損。
He was injured and [subsequently] missed the rest of the season.|他受傷了，隨後缺席整個球季剩下的比賽。
Some cleaning products contain harmful [substances] that can damage your skin.|有些清潔用品含有會傷害皮膚的有害物質。
Without [sufficient] sleep, it is hard to concentrate in class.|睡眠不足就很難在課堂上專心。
She tried to [suppress] her laughter during the meeting.|她在會議中努力忍住笑。
A [survey] found that most people want more parks.|一項調查發現多數人希望有更多公園。
The MRT service was [suspended] during the earthquake.|地震期間捷運暫停營運。
A high fever and a sore throat are common [symptoms] of the flu.|高燒和喉嚨痛是流感的常見症狀。
Modern [technology] makes it easy to talk to friends abroad.|現代科技讓和國外朋友聊天變得容易。
Lions mark their [territory] to keep other animals away.|獅子標記地盤讓其他動物遠離。
The plan sounds good in [theory], but it may not work in practice.|這計畫理論上聽起來不錯，但實際上可能行不通。
Some plants are [toxic] to cats and dogs.|有些植物對貓狗有毒。
Eating rice dumplings during the Dragon Boat Festival is a Chinese [tradition].|端午節吃粽子是華人傳統。
The government should be more [transparent] about how it spends money.|政府應更透明地公開經費使用。
Pollen can [trigger] sneezing in some people.|花粉會引發某些人打噴嚏。
Music is often called a [universal] language.|音樂常被稱為世界共通的語言。
We should [utilize] solar energy more effectively.|我們應更有效地利用太陽能。
There is a large [variation] in temperature between day and night in the desert.|沙漠中日夜溫差很大。
Solar power is now a [viable] alternative to coal.|太陽能現在是取代燃煤的可行選擇。
The night market is [vibrant] and full of energy.|夜市熱鬧又充滿活力。
Water plays a [vital] role in keeping our bodies healthy.|水在維持身體健康上扮演極重要的角色。`.split("\n");
const W=RAW.split("\n").map((l,i)=>{const[en,pos,zh,col,t,y]=l.split("|");const[s,sz]=SENT[i].split("|");return{i,n:i+1,en,pos,zh,col,s,sz,t:+t,y:y.split(","),p:pos.split(/[.\/]/)[0]}});
const yrs=w=>w.y.join("·");
const today=new Date().toLocaleDateString("sv");
const KEY="gsat500-"+today;
let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...known]))}catch(e){}};
const WKEY="gsat500-wrong";
let wrong=new Set();
try{wrong=new Set(JSON.parse(localStorage.getItem(WKEY)||"[]"))}catch(e){}
const saveW=()=>{try{localStorage.setItem(WKEY,JSON.stringify([...wrong]))}catch(e){}};
let qz={dir:"e2c",wrongOnly:false,cur:null,opts:[],done:false,c:0,t:0,last:-1};
let st={theme:-1,mode:"sent",hideZh:false,unk:false,shuf:false,fi:0,flip:false};
let order=W.map(w=>w.i);
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function view(){return order.map(i=>W[i]).filter(w=>(st.theme<0||w.t===st.theme)&&(!st.unk||!known.has(w.i)))}
function prog(){const k=known.size;$("pt").textContent=`今日已熟 ${k} / ${W.length}`;$("pb").style.width=(k/W.length*100)+"%"}
function themes(){
  const el=$("themes");el.innerHTML="";
  [[-1,"🗂","全部 "+W.length]].concat(THEMES.map((t,i)=>[i,t[0],t[1]])).forEach(([i,e,l])=>{
    const b=document.createElement("button");b.id="th"+i;
    const cnt=i<0?known.size:W.filter(w=>w.t===i&&known.has(w.i)).length;
    const tot=i<0?W.length:W.filter(w=>w.t===i).length;
    b.textContent=`${e} ${l}${i<0?"":" "+cnt+"/"+tot}`;
    if(st.theme===i)b.className="on";
    b.onclick=()=>{st.theme=i;st.fi=0;st.flip=false;render()};el.appendChild(b)});
}
function list(){
  const v=view(),el=$("list");
  el.classList.toggle("hidezh",st.hideZh);
  if(!v.length){el.innerHTML='<div class="empty">🎉 這個範圍今天都熟了</div>';return}
  el.innerHTML=v.map(w=>`<div class="w${known.has(w.i)?" known":""}" data-i="${w.i}">
    <div class="top"><span class="num">${String(w.n).padStart(3,"0")}</span><span class="en">${esc(w.en)}</span><span class="pos">${w.pos}</span></div>
    <div class="zh">${esc(w.zh)}</div><div class="col">${esc(w.col)}</div><div class="yr">📅 ${yrs(w)}</div>
    <div class="acts"><button class="k">${known.has(w.i)?"✅ 熟":"☐ 熟"}</button><button class="s">🔊</button>${st.hideZh?'<button class="p">👁</button>':""}</div></div>`).join("");
}
$("list").addEventListener("click",e=>{
  const c=e.target.closest(".w");if(!c)return;const i=+c.dataset.i;
  if(e.target.closest(".k")){known.has(i)?known.delete(i):known.add(i);save();render()}
  else if(e.target.closest(".s"))say(W[i].en);
  else if(e.target.closest(".p"))c.classList.toggle("peek");
});
function flash(){
  const v=view(),fc=$("fc");
  if(!v.length){fc.innerHTML='<div class="empty">🎉 這個範圍今天都熟了</div>';return}
  st.fi=Math.min(st.fi,v.length-1);const w=v[st.fi];
  fc.innerHTML=`<div class="meta">${THEMES[w.t][0]} ${THEMES[w.t][1]} · 📅 ${yrs(w)} · ${st.fi+1} / ${v.length}</div>
    <div class="en">${esc(w.en)}</div><div class="pos">${w.pos}</div>
    ${st.flip?`<div class="zh">${esc(w.zh)}</div><div class="col">${esc(w.col)}</div>`:'<div class="meta">點一下看中文</div>'}`;
  $("fKnow").textContent=known.has(w.i)?"✅ 已熟（取消）":"✅ 熟了";
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function qPool(){return qz.wrongOnly?view().filter(w=>wrong.has(w.i)):view()}
function newQ(){
  const pool=qPool();
  if(!pool.length){qz.cur=null;return}
  let w=pick(pool);if(pool.length>1)while(w.i===qz.last)w=pick(pool);
  qz.cur=w;qz.last=w.i;qz.done=false;
  let ds;
  if(st.mode==="sent"){
    const sameP=x=>x.i!==w.i&&x.p===w.p;
    ds=shuffle(W.filter(x=>sameP(x)&&x.t===w.t)).slice(0,3);
    if(ds.length<3)ds=ds.concat(shuffle(W.filter(x=>sameP(x)&&!ds.includes(x))).slice(0,3-ds.length));
  }else ds=shuffle(W.filter(x=>x.t===w.t&&x.i!==w.i&&x.zh!==w.zh)).slice(0,3);
  while(ds.length<3){const x=pick(W);if(x.i!==w.i&&!ds.includes(x))ds.push(x)}
  qz.opts=shuffle([w,...ds]);
}
function quiz(){
  const pct=qz.t?Math.round(qz.c/qz.t*100):0;
  $("qstat").innerHTML=`<span>答對 <b>${qz.c}</b> / ${qz.t}</span><span>正確率 <b>${pct}%</b></span><span>❌ 錯題本 <b>${wrong.size}</b></span>`;
  const w=qz.cur,qq=$("qq"),qo=$("qo"),fb=$("qfb");
  if(!w){
    qq.innerHTML=`<div class="empty">${qz.wrongOnly?"🎉 錯題都清完了":"這個範圍沒有可出的題目"}</div>`;
    qo.innerHTML="";fb.hidden=true;$("qNext").hidden=true;return}
  $("qNext").hidden=false;
  const sent=st.mode==="sent",e2c=!sent&&qz.dir==="e2c";
  const filled=esc(w.s).replace(/\[(.+?)\]/,(m,a)=>qz.done?`<u class="ans">${a}</u>`:"<span class=\"blank\">　　　　</span>");
  qq.innerHTML=`<div class="meta">${THEMES[w.t][0]} ${THEMES[w.t][1]} · 📅 ${yrs(w)} · ${sent?"選出最適合填入空格的字（選項為原形）":e2c?"選出正確中文":"選出正確英文"}</div>`+
    (sent?`<div class="sent">${filled}</div>${qz.done?`<div class="meta">${esc(w.sz)}</div>`:""}`
     :e2c?`<div class="en">${esc(w.en)}</div><div class="pos">${w.pos}</div>`:`<div class="zh">${esc(w.zh)}</div><div class="pos">${w.pos}</div>`);
  qo.className="opts"+(e2c?"":" e");
  qo.innerHTML=qz.opts.map((o,k)=>{
    let cls="";if(qz.done){if(o.i===w.i)cls="right";else if(o.i===qz.sel)cls="wrong"}
    return `<button data-k="${k}" class="${cls}" ${qz.done?"disabled":""}><span class="key">${k+1}</span><span class="t">${esc(e2c?o.zh:o.en)}</span></button>`}).join("");
  if(qz.done){
    const ok=qz.sel===w.i;
    fb.hidden=false;
    fb.innerHTML=`${ok?"✅ 答對了":"❌ 答錯了"}　<b class="en" style="font-size:1rem">${esc(w.en)}</b> <span class="pos">${w.pos}</span> ${esc(w.zh)}<span class="col">${esc(w.col)}</span>`;
  }else fb.hidden=true;
}
function answer(k){
  if(qz.done||!qz.cur)return;
  const o=qz.opts[k];if(!o)return;
  qz.sel=o.i;qz.done=true;qz.t++;
  if(o.i===qz.cur.i){qz.c++;known.add(o.i);if(qz.wrongOnly)wrong.delete(o.i)}
  else{wrong.add(qz.cur.i);known.delete(qz.cur.i)}
  save();saveW();say(qz.cur.en);themes();prog();quiz();
}
$("qo").addEventListener("click",e=>{const b=e.target.closest("button");if(b)answer(+b.dataset.k)});
$("qNext").onclick=()=>{newQ();quiz()};
$("qRe").onclick=()=>{qz.c=0;qz.t=0;newQ();quiz()};
$("qDir").onclick=()=>{qz.dir=qz.dir==="e2c"?"c2e":"e2c";qz.done=false;render()};
$("qWrong").onclick=()=>{qz.wrongOnly=!qz.wrongOnly;newQ();render()};
document.addEventListener("keydown",e=>{
  if(st.mode!=="quiz"&&st.mode!=="sent")return;
  if(/^[1-4]$/.test(e.key))answer(+e.key-1);
  else if(e.key==="Enter"&&qz.done&&e.target.tagName!=="BUTTON"){newQ();quiz()}
});
function render(){
  themes();prog();
  const isQ=st.mode==="quiz"||st.mode==="sent";
  $("mQuiz").className=st.mode==="quiz"?"on":"";$("mSent").className=st.mode==="sent"?"on":"";
  $("mList").className=st.mode==="list"?"on":"";$("mFlash").className=st.mode==="flash"?"on":"";
  $("tZh").className=st.hideZh?"on":"";$("tUnk").className=st.unk?"on":"";$("tShuf").className=st.shuf?"on":"";
  $("qDir").textContent=qz.dir==="e2c"?"🔁 英→中":"🔁 中→英";
  $("qWrong").className=qz.wrongOnly?"on":"";
  $("tZh").hidden=st.mode!=="list";$("tShuf").hidden=isQ;
  $("qDir").hidden=st.mode!=="quiz";$("qWrong").hidden=!isQ;
  $("list").hidden=st.mode!=="list";$("flash").hidden=st.mode!=="flash";$("quiz").hidden=!isQ;
  if(isQ){if(!qz.cur||!qPool().some(w=>w.i===qz.cur.i)&&!qz.done)newQ();quiz()}
  else st.mode==="list"?list():flash();
}
$("mQuiz").onclick=()=>{if(st.mode!=="quiz"){st.mode="quiz";newQ()}render()};
$("mSent").onclick=()=>{if(st.mode!=="sent"){st.mode="sent";newQ()}render()};
const step=d=>{const n=view().length;if(!n)return;st.fi=(st.fi+d+n)%n;st.flip=false;flash()};
$("mList").onclick=()=>{st.mode="list";render()};
$("mFlash").onclick=()=>{st.mode="flash";st.fi=0;st.flip=false;render()};
$("tZh").onclick=()=>{st.hideZh=!st.hideZh;render()};
$("tUnk").onclick=()=>{st.unk=!st.unk;st.fi=0;render()};
$("tShuf").onclick=()=>{st.shuf=!st.shuf;order=W.map(w=>w.i);if(st.shuf)for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}st.fi=0;render()};
$("reset").onclick=()=>{known.clear();save();render()};
$("fc").onclick=()=>{st.flip=!st.flip;flash();if(st.flip){const v=view();if(v[st.fi])say(v[st.fi].en)}};
$("fc").onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();$("fc").click()}};
$("fPrev").onclick=()=>step(-1);$("fNext").onclick=()=>step(1);
$("fKnow").onclick=()=>{const v=view(),w=v[st.fi];if(!w)return;
  if(known.has(w.i))known.delete(w.i);else{known.add(w.i);if(!st.unk)st.fi=(st.fi+1)%v.length}
  save();themes();prog();flash()};
document.addEventListener("keydown",e=>{if(st.mode!=="flash"||e.target.tagName==="BUTTON")return;if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)});
render();
</script>

<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}</script>
</body>
